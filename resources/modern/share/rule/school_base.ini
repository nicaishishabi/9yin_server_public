// 门派基础配置

// ResetPoseTime=每月1号几点重置职位（分钟）
// RefreshRuleTime=每日几点检测门规激活（分钟）（同时重置设置门规和设置公告的次数）
// SetRuleCount=每日设置门规次数
// SetNoticeCount=每日设置公告次数

[Refresh]
ResetPoseTime=60

RefreshRuleTime=60

SetRuleCount=1
SetNoticeCount=10


// VoteTime=投票持续时间（分钟）
// SetPoseTime=掌门设置职位持续时间（分钟）
// VoteCondition=投票者满足条件
// VoteTimeLimit=投票场景倒计时

[VotePose]
VoteTime=30
SetPoseTime=30
// 持有凭证方有资格投票
VoteCondition=200464
VoteTimeLimit=time_xtc_schoolmaster_master