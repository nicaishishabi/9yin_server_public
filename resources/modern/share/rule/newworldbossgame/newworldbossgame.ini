// 描述
// 玩法索引
// TeamModel
// 队伍模式    2：团队；1：小队
// StartTime
// 开始玩法的时间，格式：周几-时:分|周几-时:分
// EnterTime
// 入场时间，单位：分
// WarTime
// 战斗时长，单位：分
// WarSceneID
// 战斗场景ID
// BossInfo
// boss的基础信息，格式：boss_config,x,y,z,o|boss_config,x,y,z,o|...
// BornPos
// 出生坐标，格式：x,y,z,o
// RelivePos
// 复活坐标集合，格式：pos_index:x,y,z,o;pos_index:x,y,z,o;....       pos_index  复活位置索引
// RankRatio
// 排名奖励分配比例，按百分比分配，比例值在1-100。格式：30:20:10
// KillerRatio
// 击杀者奖励分配比例，值在1-100
// ConditionID
// 参与该玩法条件ID
// SwitchID
// 开关ID
// desc
// 玩法开启消息ID
// EnterBuffer
// 进入玩法，添加的buffer，格式：bufferID;bufferID;...
// MinTeamMembers
// 队伍最少人数，用于发奖
// DropID
// 掉落奖励ID 格式：boss_count-drop_id;boss_count-drop_id;...
// ShowBossInfo
// 拍卖行显示boss信息，针对小队boss玩法，配置boss configid
// EnterTitle
// 入场计时器标题
// LimitTitle
// 计时器标题
// CreateBossRatio
// 创建boss比例 值为百分数。例:CreateBossRatio=30,创建比例为30%
// CreateBossMaxCount
// 起始创建boss最大数量
// ConformTeamMembers
// 有效队伍人数
// MinCreateBossCount
// 最小boss创建数量

//查数据
//pubrecquery domain Domain_NewWorldBoss GameStageTimeRec
//清理数据
//pubrecclear domain Domain_NewWorldBoss GameStageTimeRec

