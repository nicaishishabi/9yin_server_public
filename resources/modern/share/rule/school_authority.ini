// 门派特权配置

// 特权ID定义
// Auth_Type_Open_Dance = 1,			// 开启一场授业
// Auth_Type_Inc_Repute,					// 加倍增加名望
// Auth_Type_Dec_Repute,					// 加倍减少名望
// Auth_Type_Add_Speed,						// 增加移动速度
// Auth_Type_Add_Damage,					// 增加攻击伤害
	
// [1]=特权ID
// MaxUseCount=重置周期内使用次数
// ResetType=重置时间类型(1:天，2：周，3：月)
// ResetDay=重置的日期、星期
// ResetTime=重置当前的时间（分钟）
// LastTime=特权效果持续时间（分钟）
// ConsumeGoods=使用特权消耗物资
// SchoolPose=特权使用者门派职位
// 1代掌门，
// 2授业长老 5授业执事
//3外务长老 6外务执事
//4内务长老 ，7 内务执事
// Params=效果参数(倍数、BuffIId)

//额外开启授业
[1]
MaxUseCount=1
ResetType=1
ResetDay=0
ResetTime=0
LastTime=0
ConsumeGoods=100
SchoolPose=2,5

//名望值增加时额外获得一倍
[2]
MaxUseCount=1
ResetType=1
ResetDay=0
ResetTime=0
LastTime=180
ConsumeGoods=100
SchoolPose=1
Params=2

//名望值减少时额外减少一倍
[3]
