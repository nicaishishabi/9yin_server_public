// [战斗类型]
// DayTaskCount=随机天任务数据
// WeekTaskCount=随机周任务数据
// SeasonTaskCount=随机赛季任务数据

// DayTaskList=天任务集合库，逗号分隔
// WeekTaskList=周任务集合库，逗号分隔
// SeasonTaskList=赛季任务集合库，逗号分隔

// ScorePrizeStep=达到一定分值，给予邮件奖励
// ScorePrizeOffset=超过最大分值，每满一定分值，给予邮件奖励

// ScoreSwitchID=双倍积分开关
// DayScoreMax=每日积分上限
// SeasonScoreMax=赛季积分上限

// CirCleOpen=是否周期开启（0：非周期，1：周期）
// IsAddTotalScore=是否累计总积分（0：不累计，1：累计）

// SeasonResetType=0:自然月重置
// SeasonResetType=1:周期控制重置（通过配置的赛季号控制）
// SeasonResetType=2:外部控制重置（玩法自己控制）

// Version=版本号，修改后重置任务

// FightBackImageOpen=玩法开放时的背景图
// FightBackImageClose=玩法关闭时的背景图
// FightName=玩法名称
// FightIcon=玩法图标
// FightDesc=玩法描述
// FormName=对应玩法的报名界面

// FightConditionID=玩法开关条件
// LimitTime=限制统计的时间段

