//参加活动的条件
//DayMaxNum 每天能进行活动的最大次数
//DoubleTime 双人活动限制时间
//SingleTime 单人活动限制时间
//MaxPoint 气槽最大点数
//AcceptBuff 修炼加的buff
//AcceptCondition 修炼的条件
//领取任务npc AcceptTaskNpc
//提交任务npc SubmitTaskNpc
//SingleTaskNpc 单人修炼npc
//各门派技能套路id TaoluID
//DoubleInc 双修使用一次技能增加的点数
//SingleInc 单修使用一次技能增加的点数
//AddLotValue 每次增加玩家的结缘值
//XiulianArea 修炼区域
[BaseRule]
DayMaxNum=1
DoubleTime=5
SingleTime=3
MaxPoint=150
DoubleInc=4
SingleInc=4
AddLotValue=20

//连击次数对应额外增加的点数
[ExtraPoint]
5=6
10=10
15=14
30=20


