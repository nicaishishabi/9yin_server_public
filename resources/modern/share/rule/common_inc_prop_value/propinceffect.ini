//属性获得的特效配置文件
//[aa],aa为属性名
//max_value属性总上限（必填，不填则默认0，无法获得）
//day_max=每天获取上限（无每天上限则不填即可）
//week_max=每周获取上限（无每周上限则不填即可）
//month_max=每月获取上限（无每月上限则不填即可）
//forever_max=永久上限（所有上限累计256行，后续建议扩容）
//flash_index飘字特效编号,对应配置在fightword.ini里
//soundpath音效路径
//effectname特效名(与上面飘字特效无关的另外一个特效)
//fatherprop父属性名

