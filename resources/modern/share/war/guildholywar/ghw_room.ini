[room_type]
// 房间分类=房间索引集合
// 10个普通，4个增益，1个最终
room_type_1=10
room_type_2=4
room_type_3=1

// 房间类型
[room_type_1]
// 阶段时间（准备时间，战斗时间，结算时间）
