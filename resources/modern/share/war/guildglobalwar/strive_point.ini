// 王旗、复活点配置

[property]
// 建造王旗的条件
condition_build_flag=29564

// 建造复活点的条件
condition_build_relive=29564

// 设置王旗字的条件
condition_set_word=0

// 默认王旗的字
flag_word =

// 建造王旗减少时间（1,2,3,4,5级）
flag_dec_time = 0,5,10,20,30

// 建造复活点减少时间（1,2,3,4,5级）
relive_dec_time = 0,5,10,20,30

// 检测人数范围(1秒检测一次)
check_range = 22

// 检测有效高度差
check_y = -5,25

// 比例对应伤害buff(进攻方人数/防守方人数(最低为1) * 100)
// (0-49,buff_1;50-99,buff2;...)
damage_buff = 0,buf_newguild_flagmark_def01;78,buf_newguild_flagmark_00;120,buf_newguild_flagmark_atk01;150,buf_newguild_flagmark_atk02;200,buf_newguild_flagmark_atk03;233,buf_newguild_flagmark_atk04;300,buf_newguild_flagmark_atk05;500,buf_newguild_flagmark_atk06;600,buf_newguild_flagmark_atk07;700,buf_newguild_flagmark_atk08;800,buf_newguild_flagmark_atk09;900,buf_newguild_flagmark_atk10;

// 检测人数范围(1秒检测一次)(龙虎柱)
check_range_side = 20

// 比例对应伤害buff(进攻方人数/防守方人数(最低为1) * 100)(龙虎柱)
// (0-49,buff_1;50-99,buff2;...)
damage_buff_side = 0,buf_newguild_shp_2020821_001;300,buf_newguild_shp_2020821_001;400,buf_newguild_shp_2020821_002;500,buf_newguild_shp_2020821_003;600,buf_newguild_shp_2020821_004;9900,buf_newguild_shp_2020821_004;

// 血量提示(从100%掉到100%以下；从50%掉到50%以下；被摧毁时)（仅在占领期提示）
