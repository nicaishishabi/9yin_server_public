hp_tips_relive = 100,sys_gsp_hp_relive_100;50,sys_gsp_hp_relive_50;0,sys_gsp_hp_relive_0;

// 王旗点击距离
flag_select_range = 5

// 王旗点击高度差(0-10)
flag_select_y = -1,2

// 王旗点击冷却（秒）
flag_select_cd = 1.0

