// [规则]
// start_time 开启活动时间(周，时，分)
// prepar_time 准备期时长s
// fight_time 战斗期时长s
// calculate_time 结算期时长s
// flag_cost 王旗价格
// camp_cost 营地价格
// flag_max 王旗购买最大次数
// flag_palyer_poslv 王旗权限职位
// stat_condition 击杀统计玩家条件
// join_buff 参加驻地战3.0标识buff
// calculate_buff 结算期玩家buff
// start_sysinfo_time 开始系统公告，提前时间，间隔时间
// clear_domain_time 清理驻地时间
// domain_award_time 领取占领奖励时间(不能跨天配置)
// join_condition 参加驻地战条件
// min_limit_active_value 活跃度
// mem_rec_max 参战成员表上限

[rule]
start_time=6,20,00
prepar_time=300
fight_time=3600
calculate_time=30
flag_cost=5000000,5000000,10000000,10000000,20000000,20000000,20000000,20000000,20000000,20000000,20000000,20000000
camp_cost=1000000,1000000,1000000,1000000,1000000,1000000,1000000,1000000,1000000,1000000,1000000,1000000
flag_max=12
flag_palyer_limit=3
stat_condition=116866
join_buff=buf_newguild_flag_shp_005
calculate_buff=buf_newguild_flag_shp_008
start_sysinfo_time=300,60
clear_domain_time=5,23,00
domain_award_time=6,21,30,00,23,30,00
join_condition=29555
min_limit_active_value=48
mem_rec_max=48

// 玩家成就
// kills 击杀玩家数
// player_demage 对玩家伤害（九阴志范围，伤害）
// flag_demage 对王旗伤害
// guarder_demage 对守卫伤害
// award 完成成就数 奖励
[player_achievement]
kills=10
player_demage=1,2,10000;3,3,20000;4,4,50000;5,5,100000;6,7,200000
flag_demage=500
guarder_demage=100
award=1,692;2,693;3,694;4,695

// 帮会成就
// flag_time 累计占据王旗时长（分钟）
// kills 击杀玩家数
// flag_times 占据过X个驻地的王旗
// guarder_kills 摧毁守卫数
// award 完成成就数 奖励
[guild_achievement]
flag_time=30
kills=100
flag_times=5
guarder_kills=10
award=1,696;2,697;3,698;4,699

