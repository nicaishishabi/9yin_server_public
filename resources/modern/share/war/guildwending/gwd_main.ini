// 帮会问鼎武林
[property]

// 进入条件
condition = 122214

// 服务器组数
group_nums = 1

// pub心跳检测最长时间,最少61秒，外网建议1800秒，必须大于apply_before
hb_max_sec = 61

// 下发数据最大行，超过300可能下发不了
see_max_rows = 200

[stage_1]
// 淘汰赛：1阶段所有帮会都可报名，胜利获得令牌

// 持续几周
weeks = 1

// 帮会报名要求帮众人数>=20
apply_guild_members = 20

// 提前40分钟帮会自动报名（获取人数、实力）
apply_before = 40

// 战斗开始时间（18:20是匹配时间，实际是30分钟后可以入场）
war_time = 1,18:20;2,18:20;3,18:20;4,18:20;5,18:20;6,18:20;7,18:20;

// 界面显示奖励
ui_price = growitem_1,1,growitem_1,2

[stage_2]
// 积分赛：1阶段有令牌的自动进入2阶段，打完取前8

// 进入2阶段时，取战区内前100帮会形成报名名单
nums = 50

// 晋级帮会成员邮件
guild_price_id = 2443

// 并且要求实力
power_level_min = title012

// 要求满足实力的人数
power_nums_min = 20

// 持续几周
weeks = 6

// 战斗开始时间（18:20是匹配时间，实际是30分钟后可以入场）
war_time = 1,18:20;3,18:20;5,18:20;

// 界面显示奖励
ui_price = growitem_1,1,growitem_1,2

[stage_3]
// 八强对决：2阶段前8进入3阶段，分成甲乙两组，场次固定，次数打完的下一周进入决赛周（X只队伍=（X/2-1）场比赛）

// 确定X强，同时固定帮会参战名单
nums = 8

// 参战名单要求入帮X天
days_for_photo = 15

// 晋级帮会成员邮件
guild_price_id = 2444

// 持续几周
weeks = 1

// 战斗开始时间（18:20是匹配时间，实际是30分钟后可以入场）
war_time = 5,18:20;6,18:20;7,18:20;
// 界面显示奖励
ui_price = growitem_1,1,growitem_1,2

[stage_4]
// 决赛 场次固定，次数打完（4只队伍=2场比赛）

// 晋级帮会成员邮件
guild_price_id = 2445

// 持续几周
weeks = 1

// 战斗开始时间（18:20是匹配时间，实际是30分钟后可以入场）
war_time = 6,18:20;7,18:20;

// 界面显示奖励
ui_price = growitem_1,1,growitem_1,2
