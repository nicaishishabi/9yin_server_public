//------------------------ 【gm命令】 ------------------------//
//【重载配置】: ts_config
//【当前战场进入下一阶段】: ts_next
//【创建指定配置的npc】: ts_npc  npc所属的组名  行号,-> 例如：ts_npc wudang 1
//【清空今天参与次数】: set TaoShaTodayJoin 0


//------------------------ 【报名配置】 ------------------------//
[apply]
// team_size队伍最大人数
// team_count战场最大队伍数
// time_match匹配间隔
// time_out超时秒数

team_size=3
team_count=8
time_match=10
time_out=20


//------------------------ 【规则】 ------------------------//

[rule]
// scene=组队逃杀所有分流场景
// center_scene_id=中转场景id
// max_player=单个战场人数上限 -> 【策划规则】每场人数上限为50人
// max_war=战场最多同时开启场数上限
// war_require_player=开启战场要求的人数个数|每场分配多少人 -> 【策划规则】当报名人数达到上限的80%，即可进行倒数进场
// max_team_size=报名队伍人数上限 -> 【策划规则】报名人数限制：分单排与双排
// time_invite=系统邀请玩家的小旗子存在时间，超时视为该玩家放弃（秒）
// time_prepare=准备时间（秒） -> 【策划规则】进入跨服中转场景之后，玩家有两分钟时间进行准备
// time_fight=战斗时间（秒）
// time_end=结算时间（秒）
// time_stop_add_player=停止补充玩家时间（秒） -> 【策划规则】准备期间最后20秒，不再补充玩家
// time_die=死亡倒地动作时间（毫秒），超过该时间则设置玩家隐身
// begin_buff=进入游戏添加buff
// prepare_buff=准备期buff，分号隔开 -> 【策划规则】给予玩家一个定身术的BUFF
// fight_buff=开始战斗buff，分号隔开 -> 【策划规则】给予玩家一个轻身术的BUFF
// punish_buff=惩罚buff
// movie=开始战斗动画id -> 【策划规则】准备时间结束之后，玩家播放过场动画
// apply_conditions=报名条件，格式：条件1&条件2....  -> 【策划规则】报名条件：江湖明俊玩家即可报名
// max_join_each_day=每天可参与次数
// quit_flow_time=退出战场的读条时间（毫秒）
// relife_flow_time=退出战场的读条时间（毫秒）
// limit_name=计时器名、计次器名，格式：等待期,准备期,战斗期,结算期
// prepare_ride_npc=准备期骑乘npc(必须有IsSpecialUse属性且大于100)
// fight_downride_second=战斗期开始后多长时间下马（秒）
// prepare_skybox_npc=准备期空投npc，用于提前显示空投坐标
// week_prize=周奖励用，隔开
// dead_switch_point=死亡传送坐标用,隔开
// dead_punish_time=死亡惩罚时间(秒)

