[System]
// 实力条件判定
LevelCondition=121268

// 武学限制buffer
WuxueLimitBuffer=buff_lzy_slzc_wxxz

// 无限制场条件判定
NoLimitCondition=

// 势力最大人数
// 注：此处配置的人数不能大于NewWarRule\WarBaseRule.ini对应玩法配置的势力正常进入最大人数
MaxPlayerCount=20

// 人员分配最大人数差（需要参考对战双方积分）
MaxNumDiff=2

// 战斗开始清理未进入玩家时间  单位：秒
ClearPlayerTime=40

// 战斗停止补员时间  单位：分
StopJoinTime=10

// 积分翻倍时间  单位：分
IntegralMultipleTime=10

// 积分倍率
IntegralMultiple=2

// 战斗提前结束积分
OverWarIntegral=1000

[ScoreValue]
// 分值信息
// 格式：玩家评级=分数,组队额外加分数
//	玩家评级：1：普通玩家；2：星级玩家
1=1,0
2=1.5,0.5

// 势力buffer
[PowerBuffer]
// 格式：势力索引=bufferID,bufferID,.....,bufferID
1=buff_lzy_slzc_hong
2=buff_lzy_slzc_lan

// 事件
[GameEvent]
// EventTime 事件发生时间点  
// 格式：事件索引-时间点集合|事件索引-时间点集合|...	多时间点之间用,隔开  单位：分
// EventNum 事件数量    格式：事件索引-事件数量|事件索引-事件数量|...
// EventPos 事件坐标集合，格式：事件索引:x,y,z,o;x,y,z,o|事件索引:x,y,z,o;x,y,z,o|...
// EventNpc 事件npc，格式：事件索引-npc集合|事件索引-npc集合|...    多npc，用,隔开
// EventDesc 事件消息提示  格式：事件索引-消息ID|事件索引-消息ID|...
// 注：事件索引从1开始，0或者不填，视为非法数据，不做处理
EventTime=1-5,15|2-4,6,8,11,13,16,18
EventNum=1-3|2-1
EventPos=1:159.8,347,76.8,0;70,347.8,-13,0;159,347.5,-100,0;248,348,13,0|2:159,352.7,-13,0
EventNpc=1-npc_lzy_slzc_sj01,npc_lzy_slzc_sj02,npc_lzy_slzc_sj03|2-war_xueyu001,war_xueyu002
EventDesc=1-sys_20v20xlby_011_|2-sys_20v20xlby_012_