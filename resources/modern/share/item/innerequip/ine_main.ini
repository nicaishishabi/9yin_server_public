[property]

// 内甲生效在哪些tvt玩法中
// 198=挑战禁地，108=暮色
tvt=198,214

// 评分基础分，评分=100*（1+浸润百分比加成+精炼百分比加成）
base_score = 100

// 属性关注最大值,程序上限16
focus_max = 15

// 赛季关联属性，奇数赛季、偶数赛季；玩家赛季差2清除全部，差1只清理当前赛季关联属性
clear_prop_1=LG_reload,LG_piece,LG_up_le1,LG_up_le2,LG_up_le3
clear_prop_2=LG_newreload,LG_newpiece,LG_up_newle1,LG_up_newle2,LG_up_newle3

// 一键换装的位置集合
set_pos = 44,45,46,47,48,51,52

// 换装冷却 秒
change_set_cd = 20

[area]
// 进入这些区域后，会设置tvt
area_clone065_muzhuang=214
// area_2=214
// area_3=214
// area_4=214
// area_5=214
// area_6=214

[sel_suit]
// 选择套装偏向=id,倍率
prop_1_suit = 10052,6;10054,6;10056,6;10058,6;10060,6;10062,6;10064,6;
prop_2_suit = 10053,6;10055,6;10057,6;10059,6;10061,6;10063,6;10065,6;

[sel_set]
// 套装偏向=id，倍率
