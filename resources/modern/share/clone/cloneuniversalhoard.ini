// 秘藏通宝

[property]
// 开奖时间 (周一11点)
draw_week = 1,2
draw_time = 00:10

// 周几0点清理数据
clear_week = 4

// 通关、击杀的分钱比例
allot = 100,0

// 版本号
version = 3

// 禁地列表
[clone_list]
1=ini\scene\clone040
2=ini\scene\clone043
3=ini\scene\clone053
4=ini\scene\clone055
5=ini\scene\clone063
6=ini\scene\clone069

// 九阴志对应的禁地列表
[clone_open]
// 几内=几个：固定列表：轮换列表
1=0::0
2=0::0
3=0::0
3.5=1::1
4=1::1
4.5=1::1
5=2::1,2,3
5.5=2::1,2,3
6=2:1,6,2,6,3,6,4,6,5,6:1,2,3,4,5,6

// 禁地配置
// 奖励（达标值,掉落id;...）
